- id: environment-team
  config:
    stateDirectory: !!js dshHomePath('environment-team')
    label: Recorded destination
    provider: deepseek-official
    model: deepseek-v4-flash
    agentPreset: standard
    sandboxMode: workspace-write
    approvalPolicy: ask
    workspaces:
      project: !!js process.cwd()
    peers: []

# The borrowed recording has no Windows ACL skill catalog and executes no shell commands.
- id: sandbox
  config:
    runnerCommand: [bash, -c, 'while [ "$1" != "--" ]; do shift; done; shift; exec "$@"', passthrough-runner]
    runnerFailureSignatures: ['passthrough-runner: profile rejected']
