# Run from this checkout after pnpm run build. See docs/user/guide/environment-teams.md.
- insert:
    - id: environment-team
      name: '../../../../packages/experimental/environment-team/lib/index.js'
      config:
        stateDirectory: !!js dshHomePath('environment-team')
        label: !!js process.env.DSH_ENVIRONMENT_LABEL
        provider: !!js process.env.DSH_TEAM_PROVIDER
        model: !!js process.env.DSH_TEAM_MODEL
        agentPreset: !!js process.env.DSH_TEAM_PRESET
        sandboxMode: !!js process.env.DSH_TEAM_SANDBOX
        approvalPolicy: !!js process.env.DSH_TEAM_APPROVAL
        workspaces:
          project: !!js process.env.DSH_TEAM_WORKSPACE
        peers: !!js JSON.parse(process.env.DSH_TEAM_PEERS || '[]')
